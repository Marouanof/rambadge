server.port=8081
spring.application.name=Backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigba_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8080/realms/sigba-realm}

# Keycloak Admin API (création de comptes)
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:sigba-realm}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:sigba-frontend}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASS:}

# Logging
logging.level.ma.ram.sigba=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
sigba.upload.dir=./uploads

# Mail (Mailtrap)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Init SQL (seed data)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true